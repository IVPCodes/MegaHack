<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free MH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0d0e13;
    --bg-soft: #14161d;
    --panel: #191b24;
    --line: #262936;
    --blurple: #5865F2;
    --blurple-soft: #8b93ff;
    --text: #ECEEF1;
    --muted: #8b90a0;
    --online: #23a55a;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding: 40px 20px;
    position: relative;
    overflow-x:hidden;
  }

  .nodes{
    position: fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    opacity:0.55;
  }
  .nodes svg{ width:100%; height:100%; }
  .nodes circle{ fill: var(--blurple); opacity:0.5; }
  .nodes line{ stroke: var(--blurple); stroke-opacity:0.12; stroke-width:1; }
  .pulse{ animation: pulse 4s ease-in-out infinite; }
  @keyframes pulse{
    0%,100%{ opacity:0.25; }
    50%{ opacity:0.75; }
  }
  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width: 480px;
    background: linear-gradient(180deg, var(--panel), var(--bg-soft));
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 40px 36px 32px;
    box-shadow: 0 30px 80px -20px rgba(88,101,242,0.25), 0 0 0 1px rgba(255,255,255,0.02) inset;
  }
  .logo-wrap{
    width:88px; height:88px;
    margin: 0 auto 22px;
    position:relative;
    border-radius: 26px;
    padding: 3px;
    background: conic-gradient(from 180deg, var(--blurple), #a0a8ff, var(--blurple));
  }
  .logo-wrap img{
    width:100%; height:100%;
    border-radius: 23px;
    display:block;
    background: var(--bg);
    object-fit: cover;
  }
  .eyebrow{
    text-align:center;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--blurple-soft);
    font-weight: 600;
    margin-bottom: 10px;
  }
  h1{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 30px;
    font-weight: 700;
    text-align:center;
    margin: 0 0 14px;
    line-height:1.15;
    letter-spacing:-0.01em;
  }
  .stats{
    display:flex;
    justify-content:center;
    gap: 18px;
    margin-bottom: 20px;
    font-size: 13px;
    color: var(--muted);
  }
  .stat{ display:flex; align-items:center; gap:6px; }
  .dot{ width:8px; height:8px; border-radius:50%; }
  .dot.total{ background: var(--muted); }
  .stat b{ color: var(--text); font-weight:600; }
  .desc{
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--muted);
    text-align:center;
    padding: 6px 10px;
    margin-bottom: 26px;
  }
  .join-btn{
    display:block;
    width:100%;
    padding: 13px;
    background: var(--blurple);
    color:#fff;
    text-decoration:none;
    text-align:center;
    border:none;
    border-radius: 12px;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size: 14.5px;
    cursor:pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .join-btn:hover{ background: #4752c4; }
  .join-btn:active{ transform: scale(0.98); }
  .divider{
    height:1px;
    background: var(--line);
    margin: 24px 0 16px;
  }
  .credit{
    text-align:center;
    font-size: 12px;
    color: #5a5f6f;
  }
  .credit span{
    color: var(--muted);
  }
  @media (prefers-reduced-motion: reduce){
    .pulse{ animation:none; }
  }
</style>
</head>
<body>
<div class="nodes" id="nodeField"></div>
<div class="card">
  <div class="logo-wrap">
    <img id="logoImg" crossorigin="anonymous" src="https://cdn.discordapp.com/icons/1504926343685738506/6ca152f1048c618fdf9fcaa8a818d4a9.webp?size=480" alt="Server logo">
  </div>
  <div class="eyebrow">Discord Server</div>
  <h1 id="serverName"></h1>
  <div class="stats">
    <div class="stat"><span class="dot total"></span><b id="memberCount">—</b> members</div>
  </div>
  <div class="desc" id="serverDesc"></div>
  <a class="join-btn" id="joinBtn" href="#" target="_blank" rel="noopener">Join Server</a>
  <div class="divider"></div>
  <div class="credit">Made by <span id="creditName"></span></div>
</div>
<script>
  const SERVER_NAME = "Free MH";
  const SERVER_DESCRIPTION = "This is a Discord server where you can get Free MegaHack V9.13. Trusted by 170+ Members!";
  const MEMBER_COUNT = 250;
  const MADE_BY = "Atez";
  const INVITE_LINK = "https://discord.gg/3Vtf6AMqh3";
  document.getElementById('serverName').textContent = SERVER_NAME;
  document.getElementById('serverDesc').textContent = SERVER_DESCRIPTION;
  document.getElementById('memberCount').textContent = MEMBER_COUNT.toLocaleString() + '+';
  document.getElementById('creditName').textContent = MADE_BY;
  document.getElementById('joinBtn').href = INVITE_LINK;
  document.title = SERVER_NAME;
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function rgbToHsl(r,g,b){
    r/=255; g/=255; b/=255;
    const max = Math.max(r,g,b), min = Math.min(r,g,b);
    let h, s, l = (max+min)/2;
    if(max === min){ h = s = 0; }
    else {
      const d = max-min;
      s = l > 0.5 ? d/(2-max-min) : d/(max+min);
      switch(max){
        case r: h = (g-b)/d + (g<b?6:0); break;
        case g: h = (b-r)/d + 2; break;
        case b: h = (r-g)/d + 4; break;
      }
      h /= 6;
    }
    return [h*360, s, l];
  }
  function hslToCss(h,s,l){ return `hsl(${h.toFixed(1)}, ${(s*100).toFixed(1)}%, ${(l*100).toFixed(1)}%)`; }
  function applyThemeFromColors(vibrant, muted){
    const root = document.documentElement.style;
    const [h, s] = rgbToHsl(...vibrant);
    const accent = hslToCss(h, clamp(s,0.45,0.85), 0.62);
    const accentSoft = hslToCss(h, clamp(s,0.35,0.7), 0.75);
    const bg = hslToCss(h, clamp(s*0.5,0.12,0.35), 0.055);
    const bgSoft = hslToCss(h, clamp(s*0.45,0.1,0.3), 0.085);
    const panel = hslToCss(h, clamp(s*0.4,0.08,0.28), 0.1);
    const line = hslToCss(h, clamp(s*0.35,0.08,0.25), 0.18);
    root.setProperty('--blurple', accent);
    root.setProperty('--blurple-soft', accentSoft);
    root.setProperty('--bg', bg);
    root.setProperty('--bg-soft', bgSoft);
    root.setProperty('--panel', panel);
    root.setProperty('--line', line);
    document.body.style.background = bg;
  }
  function extractPaletteFromImage(img){
    try{
      const canvas = document.createElement('canvas');
      const size = 64;
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, size, size);
      const data = ctx.getImageData(0, 0, size, size).data;

      const buckets = {};
      for(let i=0; i<data.length; i+=4){
        const r=data[i], g=data[i+1], b=data[i+2], a=data[i+3];
        if(a < 200) continue;
        const [h,s,l] = rgbToHsl(r,g,b);
        if(l < 0.06 || l > 0.94) continue;
        const key = `${Math.round(h/10)}-${Math.round(s*10)}-${Math.round(l*10)}`;
        if(!buckets[key]) buckets[key] = { count:0, r:0,g:0,b:0, s };
        buckets[key].count++;
        buckets[key].r += r; buckets[key].g += g; buckets[key].b += b;
      }
      const entries = Object.values(buckets);
      if(!entries.length) return null;
      entries.forEach(e => e.score = e.count * (0.3 + e.s));
      entries.sort((a,b) => b.score - a.score);
      const top = entries[0];
      const vibrant = [top.r/top.count, top.g/top.count, top.b/top.count];
      return vibrant;
    } catch(err){
      return null;
    }
  }
  const logoImg = document.getElementById('logoImg');
  function tryExtract(){
    const vibrant = extractPaletteFromImage(logoImg);
    if(vibrant) applyThemeFromColors(vibrant);
    buildNodes();
  }
  if(logoImg.complete && logoImg.naturalWidth){
    tryExtract();
  } else {
    logoImg.addEventListener('load', tryExtract);
    logoImg.addEventListener('error', () => buildNodes());
  }
  const svgNS = "http://www.w3.org/2000/svg";
  const container = document.getElementById('nodeField');
  const svg = document.createElementNS(svgNS, "svg");
  container.appendChild(svg);

  function buildNodes(){
    svg.innerHTML = "";
    const w = window.innerWidth, h = window.innerHeight;
    svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
    const count = Math.max(14, Math.min(28, Math.floor((w*h)/60000)));
    const pts = [];
    for(let i=0;i<count;i++){
      pts.push({ x: Math.random()*w, y: Math.random()*h });
    }
    for(let i=0;i<pts.length;i++){
      for(let j=i+1;j<pts.length;j++){
        const dx = pts[i].x-pts[j].x, dy = pts[i].y-pts[j].y;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if(dist < w*0.16){
          const line = document.createElementNS(svgNS,"line");
          line.setAttribute("x1", pts[i].x);
          line.setAttribute("y1", pts[i].y);
          line.setAttribute("x2", pts[j].x);
          line.setAttribute("y2", pts[j].y);
          svg.appendChild(line);
        }
      }
    }
    pts.forEach((p,idx)=>{
      const c = document.createElementNS(svgNS,"circle");
      c.setAttribute("cx", p.x);
      c.setAttribute("cy", p.y);
      c.setAttribute("r", 2.2);
      c.classList.add("pulse");
      c.style.animationDelay = (idx*0.3)+"s";
      svg.appendChild(c);
    });
  }
  buildNodes();
  window.addEventListener('resize', buildNodes);
</script>
</body>
</html>
